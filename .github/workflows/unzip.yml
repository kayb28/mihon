name: Unzip patch

on: workflow_dispatch

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip over repo
        run: |
          unzip -o mihonfix-phases-1-2.zip -x '.github/*'
          rm mihonfix-phases-1-2.zip

      - name: Commit if changes exist
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para confirmar."
          else
            git commit -m "Aplicar parche del reparador"
            git push
          fi
