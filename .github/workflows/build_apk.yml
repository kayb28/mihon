name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Writing release.keystore."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "No custom keystore found in secrets. Falling back to debug signing."
          fi

      - name: Build Release APK
        env:
          MIHON_GITHUB_RELEASE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          storeFile: ${{ github.workspace }}/release.keystore
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false

      - name: Upload Release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mihon-release-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  build_unminified:
    name: Build Unminified APK (No R8)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Writing release.keystore."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "No custom keystore found in secrets. Falling back to debug signing."
          fi

      - name: Build Unminified APK
        env:
          MIHON_GITHUB_RELEASE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          storeFile: ${{ github.workspace }}/release.keystore
          storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pdist=ci -Pinclude-telemetry=false -PdisableMinify=true

      - name: Upload Unminified APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mihon-unminified-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30
