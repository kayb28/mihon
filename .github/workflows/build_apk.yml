name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and checks'
        required: false
        default: false
        type: boolean
      build_extensions:
        description: 'Build the extension APKs too (on push they only build when their code changes)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup Signing Keystore
        id: setup_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Configuring release signing."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "MIHON_GITHUB_RELEASE=true" >> $GITHUB_ENV
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "storePassword=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "keyAlias=$KEY_ALIAS" >> $GITHUB_ENV
            echo "keyPassword=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No custom keystore found in secrets. Falling back to debug signing."
          fi

      - name: Build Release APK
        # Fork (applicationId app.mihonfix) has no Firebase client in app/google-services.json;
        # telemetry must stay off or :app:processReleaseGoogleServices fails with "No matching client".
        # Scoped to :app so the extension modules (not dependencies of the app) stay out of
        # every build; they have their own gated jobs below.
        run: ./gradlew :app:assembleRelease -Pdist=ci -Pinclude-telemetry=false

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-release-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  build_unminified:
    name: Build Unminified APK (No R8)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "MIHON_GITHUB_RELEASE=true" >> $GITHUB_ENV
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "storePassword=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "keyAlias=$KEY_ALIAS" >> $GITHUB_ENV
            echo "keyPassword=$KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Build Unminified APK
        # Scoped to :app for the same reason as the release job: extensions have their own jobs.
        run: ./gradlew :app:assembleRelease -Pdist=ci -Pinclude-telemetry=false -PdisableMinify=true

      - name: Upload Unminified APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-unminified-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

  # A plain `assembleRelease` builds the extension modules too (three times per push, with
  # the two dedicated jobs), which the user asked to avoid: every push should only compile
  # Mihon. The extension jobs below stay available for when their code actually changes -
  # detected from the push's commits - or on demand via the workflow_dispatch input.
  changes:
    name: Detect extension changes
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.detect.outputs.extensions }}
    steps:
      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.build_extensions }}" = "true" ]; then
              echo "extensions=true" >> "$GITHUB_OUTPUT"
            else
              echo "extensions=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # The push event's commit objects arrive in the workflow context WITHOUT their
          # added/modified/removed file lists, so the changed files come from the compare
          # API instead (this push, before..after). Also match the workflow itself so a
          # change to this gating can be exercised by a normal push. When the compare is
          # unavailable or truncated the extensions build anyway - the safe side is an
          # extra build, not a silently stale extension APK.
          RESP="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}" || true)"
          if [ -z "$RESP" ]; then
            echo "compare unavailable; building extensions to be safe"
            echo "extensions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r '.truncated' <<<"$RESP")" = "true" ]; then
            echo "compare truncated; building extensions to be safe"
            echo "extensions=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -r '.files[]?.filename' <<<"$RESP" | grep -qE '^(\.github/workflows/build_apk\.yml|extension-(mhscans|emperorscan)/)'; then
            echo "extensions=true" >> "$GITHUB_OUTPUT"
          else
            echo "extensions=false" >> "$GITHUB_OUTPUT"
          fi

  build_extension:
    name: Build MHScans Extension APK
    needs: changes
    if: needs.changes.outputs.extensions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Same stable keystore as the app jobs: keeps the extension's signature constant so a
      # rebuilt extension APK installs as an update instead of requiring an uninstall.
      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Configuring release signing."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "MIHON_GITHUB_RELEASE=true" >> $GITHUB_ENV
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "storePassword=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "keyAlias=$KEY_ALIAS" >> $GITHUB_ENV
            echo "keyPassword=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No custom keystore found in secrets. Falling back to debug signing."
          fi

      # Signs release with the debug config (same scheme as the app), repointed at the
      # stable keystore above when it is available.
      - name: Build MHScans extension APK
        run: ./gradlew :extension-mhscans:assembleRelease -Pinclude-telemetry=false

      - name: Upload MHScans extension APK
        uses: actions/upload-artifact@v4
        with:
          name: mhscans-extension-apk-${{ github.sha }}
          path: |
            extension-mhscans/build/outputs/apk/release/*.apk
          retention-days: 30

  build_emperorscan_extension:
    name: Build Emperor Scan Extension APK
    needs: changes
    if: needs.changes.outputs.extensions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Same stable keystore as the app jobs: keeps the extension's signature constant so a
      # rebuilt extension APK installs as an update instead of requiring an uninstall.
      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found. Configuring release signing."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "MIHON_GITHUB_RELEASE=true" >> $GITHUB_ENV
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "storePassword=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "keyAlias=$KEY_ALIAS" >> $GITHUB_ENV
            echo "keyPassword=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No custom keystore found in secrets. Falling back to debug signing."
          fi

      # Signs release with the debug config (same scheme as the app), repointed at the
      # stable keystore above when it is available. The module inlines the multisrc body
      # (eu.kanade.tachiyomi.extension.es.emperorscan.imperiomanhwa.*) reconstructed from the
      # upstream keiyoushi APK v1.6.74 — source id preserved so library entries survive.
      - name: Build Emperor Scan extension APK
        run: ./gradlew :extension-emperorscan:assembleRelease -Pinclude-telemetry=false

      - name: Upload Emperor Scan extension APK
        uses: actions/upload-artifact@v4
        with:
          name: emperorscan-extension-apk-${{ github.sha }}
          path: |
            extension-emperorscan/build/outputs/apk/release/*.apk
          retention-days: 30
